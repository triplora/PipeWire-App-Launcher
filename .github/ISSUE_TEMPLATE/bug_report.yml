name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private paths and project data from logs before posting.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.3
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Linux distribution and desktop session
      placeholder: Ubuntu 24.04, GNOME on Wayland
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
